services:
  db:
    # Official Postgres 16 plus the pgvector extension (Phase 2 similarity search).
    # The -trixie tag matters: postgres:16 is built on Debian trixie (glibc 2.41),
    # and text-index sort order comes from glibc. Reusing a volume under the
    # bookworm-based tag (glibc 2.36) triggers a collation-version mismatch that
    # can silently corrupt B-tree indexes on text columns.
    image: pgvector/pgvector:pg16-trixie
    environment:
      POSTGRES_USER: constellation
      POSTGRES_PASSWORD: constellation
      POSTGRES_DB: constellation
    ports:
      - "5433:5432" # 5433 on the host avoids clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U constellation"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
